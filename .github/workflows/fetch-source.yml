name: Fetch free-llm-intel data source

on:
  workflow_dispatch:
  # 只做手动触发，不开 schedule

permissions:
  contents: write
  actions: write

jobs:
  fetch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Fetch free-llm-intel subscription
        run: npx tsx scripts/fetch-source.ts

      - name: Verify official sources
        run: npx tsx scripts/verify-sources.ts

      - name: Commit data files if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATA_FILES="public/data/wool.json public/data/news.json public/data/sources.json public/data/evidence.json"
          if git status --porcelain -- $DATA_FILES | grep -q .; then
            git add $DATA_FILES
            git commit -m "data(source): refresh wool.json, news.json, sources.json and evidence.json"
            git push
          else
            echo "public/data 数据文件未变更，无需提交"
          fi

      - name: Trigger Pages deployment
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
